<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Air Mouse Pro Controller</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 14px; font-family: 'Segoe UI', sans-serif;
      background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh;
    }
    .header {
      background: #1e293b; padding: 12px 16px; border-radius: 12px; margin-bottom: 10px;
      font-size: 14px;
    }
    .status-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; background: #ef4444; }
    .dot.online { background: #22c55e; }
    .slider-row { display: flex; align-items: center; gap: 10px; }
    input[type=range] { flex: 1; accent-color: #3b82f6; }

    /* Area Status & Trackpad Dua Jari Opsional */
    .status-area {
      flex: 1; background: #1e293b; border: 2px dashed #334155; border-radius: 14px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 15px; margin-bottom: 10px; transition: 0.2s;
    }
    .state-badge {
      font-size: 24px; font-weight: bold; padding: 8px 20px; border-radius: 8px;
      background: #334155; margin-bottom: 8px;
    }
    .state-MOVE { background: #2563eb; }
    .state-SCROLL { background: #d97706; }
    .state-HOLD { background: #16a34a; }

    /* Tombol Utama: SCROLL & PRIMARY/HOLD */
    .main-buttons {
      display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; height: 180px; margin-bottom: 10px;
    }
    .btn {
      border: none; border-radius: 14px; font-weight: bold; color: white;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      font-size: 18px; cursor: pointer; touch-action: none;
    }
    .btn span { font-size: 12px; font-weight: normal; opacity: 0.85; margin-top: 4px; }
    #btnScroll { background: #475569; }
    #btnScroll.active { background: #f59e0b; color: #000; }
    #btnPrimary { background: #2563eb; font-size: 20px; }
    #btnPrimary.holding { background: #16a34a; }

    /* Baris Bawah: RIGHT & KALIBRASI/START */
    .bottom-buttons {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; height: 65px;
    }
    #btnRight { background: #334155; font-size: 16px; }
    #btnStart { background: #10b981; color: #000; font-size: 16px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="status-row">
      <div><strong>Status:</strong> <span id="connText">Disconnected</span> <span id="connDot" class="dot"></span></div>
      <div id="fpsInfo">0 Hz</div>
    </div>
    <div class="slider-row">
      <span>Sensitivity: <strong id="sensVal">1.5x</strong></span>
      <input type="range" id="sensSlider" min="0.5" max="3.0" step="0.1" value="1.5">
    </div>
  </div>

  <div class="status-area" id="touchpadArea">
    <div id="stateBadge" class="state-badge state-MOVE">MODE: MOVE</div>
    <div id="debugText" style="font-family:monospace; font-size:12px; color:#94a3b8;">
      Tekan tombol "AKTIFKAN SENSOR" di kanan bawah untuk memulai
    </div>
  </div>

  <div class="main-buttons">
    <button class="btn" id="btnScroll">
      SCROLL
      <span>(Tahan & Miringkan HP)</span>
    </button>
    <button class="btn" id="btnPrimary">
      PRIMARY / HOLD
      <span>(Tap = Klik | Tahan >300ms = Drag)</span>
    </button>
  </div>

  <div class="bottom-buttons">
    <button class="btn" id="btnRight">RIGHT CLICK</button>
    <button class="btn" id="btnStart" onclick="initSensors()">AKTIFKAN SENSOR</button>
  </div>

<script>
  // Topik komunikasi real-time (bisa diganti sesuai ID unik Anda)
  const CHANNEL_STREAM = "airmouse_pro/user_01/stream";
  const client = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

  // Parameter Sensor Fusion & State Machine sesuai rancangan
  const ALPHA = 0.98;             // Complementary Filter alpha = 0.98
  const TAP_THRESHOLD_MS = 250;   // Tap singkat < 250 ms
  const HOLD_THRESHOLD_MS = 300;  // Hold > 300 ms
  const MAX_TAP_MOVEMENT = 2.5;   // Anti-accidental click threshold

  let currentState = "MOVE";      // MOVE | SCROLL | HOLD
  let sensitivity = 1.5;
  let isSensorActive = false;

  // Data IMU mentah & hasil Sensor Fusion
  let rawAccel = { x: 0, y: 0, z: 0 };
  let rawGyro  = { alpha: 0, beta: 0, gamma: 0 }; // deg/s
  let fusedPitch = 0, fusedRoll = 0;
  let basePitch = 0, baseRoll = 0; // Titik referensi saat tombol SCROLL mulai ditahan
  let lastSensorTimestamp = null;

  // Variabel Anti-Accidental Click & Hold Timer
  let touchStartTime = 0;
  let accumulatedMoveDuringTap = 0;
  let holdTimer = null;
  let isLeftButtonDown = false;

  // Haptic Feedback Helper
  function triggerHaptic(ms = 35) {
    if (navigator.vibrate) navigator.vibrate(ms);
  }

  function updateUIState(newState) {
    currentState = newState;
    const badge = document.getElementById("stateBadge");
    badge.className = "state-badge state-" + newState;
    badge.innerText = "MODE: " + newState;
  }

  client.on("connect", () => {
    document.getElementById("connText").innerText = "Connected";
    document.getElementById("connDot").classList.add("online");
  });

  function sendPacket(packet) {
    if (client.connected) {
      client.publish(CHANNEL_STREAM, JSON.stringify(packet));
    }
  }

  // Slider Sensitivitas (0.5x - 3.0x)
  document.getElementById("sensSlider").addEventListener("input", (e) => {
    sensitivity = parseFloat(e.target.value);
    document.getElementById("sensVal").innerText = sensitivity.toFixed(1) + "x";
  });

  // =====================================================
  // 1. LOGIKA TOMBOL SCROLL (Press-and-Hold berbasis Tilt)
  // =====================================================
  const btnScroll = document.getElementById("btnScroll");
  btnScroll.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    triggerHaptic(30);
    // Kunci orientasi saat ini sebagai titik 0 (tengah) untuk tilt scroll
    basePitch = fusedPitch;
    baseRoll  = fusedRoll;
    btnScroll.classList.add("active");
    updateUIState("SCROLL");
    sendPacket({ t: "MODE", m: "SCROLL_ON" });
  });

  function stopScrollMode() {
    if (currentState === "SCROLL") {
      btnScroll.classList.remove("active");
      updateUIState("MOVE");
      sendPacket({ t: "MODE", m: "SCROLL_OFF" });
    }
  }
  btnScroll.addEventListener("pointerup", stopScrollMode);
  btnScroll.addEventListener("pointercancel", stopScrollMode);

  // =====================================================
  // 2. LOGIKA TOMBOL PRIMARY / HOLD (Tap, Hold >300ms, Drag)
  // =====================================================
  const btnPrimary = document.getElementById("btnPrimary");
  btnPrimary.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    touchStartTime = performance.now();
    accumulatedMoveDuringTap = 0;

    // Timer untuk mendeteksi Hold > 300 ms
    holdTimer = setTimeout(() => {
      isLeftButtonDown = true;
      btnPrimary.classList.add("holding");
      updateUIState("HOLD");
      triggerHaptic([40, 30, 40]); // Getar ganda tanda HOLD/DRAG aktif
      sendPacket({ t: "BTN", b: "LEFT", a: "DOWN" });
    }, HOLD_THRESHOLD_MS);
  });

  function releasePrimaryButton() {
    if (holdTimer) {
      clearTimeout(holdTimer);
      holdTimer = null;
    }
    const duration = performance.now() - touchStartTime;

    if (isLeftButtonDown) {
      // Akhiri mode HOLD / DRAG -> Kirim MOUSE_UP
      isLeftButtonDown = false;
      btnPrimary.classList.remove("holding");
      updateUIState("MOVE");
      triggerHaptic(25);
      sendPacket({ t: "BTN", b: "LEFT", a: "UP" });
    } else if (duration < TAP_THRESHOLD_MS) {
      // Anti-accidental click: hanya klik jika tangan tidak sedang mengayun kencang
      if (accumulatedMoveDuringTap < MAX_TAP_MOVEMENT) {
        triggerHaptic(20);
        sendPacket({ t: "BTN", b: "LEFT", a: "CLICK" });
      }
    }
  }
  btnPrimary.addEventListener("pointerup", releasePrimaryButton);
  btnPrimary.addEventListener("pointercancel", releasePrimaryButton);

  // =====================================================
  // 3. TOMBOL KLIK KANAN (Secondary Button)
  // =====================================================
  document.getElementById("btnRight").addEventListener("pointerdown", (e) => {
    e.preventDefault();
    triggerHaptic(30);
    sendPacket({ t: "BTN", b: "RIGHT", a: "CLICK" });
  });

  // =====================================================
  // 4. INISIALISASI IMU & SENSOR FUSION (Complementary Filter)
  // =====================================================
  async function initSensors() {
    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
      const perm = await DeviceMotionEvent.requestPermission();
      if (perm !== "granted") return alert("Izin sensor ditolak oleh browser!");
    }

    window.addEventListener("devicemotion", (e) => {
      const now = performance.now();
      const dt = lastSensorTimestamp ? (now - lastSensorTimestamp) / 1000.0 : 0.016;
      lastSensorTimestamp = now;

      if (e.accelerationIncludingGravity) {
        rawAccel.x = e.accelerationIncludingGravity.x || 0;
        rawAccel.y = e.accelerationIncludingGravity.y || 0;
        rawAccel.z = e.accelerationIncludingGravity.z || 0;
      }
      if (e.rotationRate) {
        // rotationRate dalam derajat/detik (deg/s)
        rawGyro.alpha = e.rotationRate.alpha || 0; // Pitch rate (Atas-Bawah)
        rawGyro.beta  = e.rotationRate.beta  || 0; // Roll rate (Miring Kiri-Kanan)
        rawGyro.gamma = e.rotationRate.gamma || 0; // Yaw rate (Menoleh Kiri-Kanan)
      }

      // Hitung sudut orientasi dari Accelerometer (dalam derajat)
      const accelPitch = Math.atan2(rawAccel.y, Math.sqrt(rawAccel.x * rawAccel.x + rawAccel.z * rawAccel.z)) * (180 / Math.PI);
      const accelRoll  = Math.atan2(-rawAccel.x, rawAccel.z) * (180 / Math.PI);

      // Rumus Complementary Filter sesuai Bab 9:
      // angle = alpha * (angle + gyro * dt) + (1 - alpha) * accel_angle
      fusedPitch = ALPHA * (fusedPitch + rawGyro.alpha * dt) + (1 - ALPHA) * accelPitch;
      fusedRoll  = ALPHA * (fusedRoll  + rawGyro.gamma * dt) + (1 - ALPHA) * accelRoll;

      // Akumulasi pergerakan selama jari menyentuh tombol (untuk Anti-Accidental Click)
      const instantSpeed = Math.hypot(rawGyro.alpha, rawGyro.gamma) * dt;
      accumulatedMoveDuringTap += instantSpeed;
    });

    if (!isSensorActive) {
      isSensorActive = true;
      document.getElementById("btnStart").innerText = "RE-CENTER (KALIBRASI)";
      document.getElementById("fpsInfo").innerText = "50 Hz";

      // Loop pengiriman paket gerak/scroll (50 Hz = setiap 20 ms) & Heartbeat
      setInterval(() => {
        if (currentState === "SCROLL") {
          // Hitung sudut kemiringan (tilt) terhadap titik awal saat SCROLL ditekan
          const pitchDelta = fusedPitch - basePitch;
          const rollDelta  = fusedRoll  - baseRoll;

          sendPacket({
            t: "SCROLL",
            tiltPitch: Number(pitchDelta.toFixed(2)),
            tiltRoll:  Number(rollDelta.toFixed(2)),
            ts: Date.now()
          });
          document.getElementById("debugText").innerText =
            `SCROLL TILT | Vertikal: ${pitchDelta.toFixed(1)}° | Horizontal: ${rollDelta.toFixed(1)}°`;
        } else {
          // Mode MOVE atau HOLD/DRAG: kirim kecepatan sudut & orientasi terfusi
          sendPacket({
            t: "MOVE",
            yawRate: Number(rawGyro.gamma.toFixed(2)),
            pitchRate: Number(rawGyro.alpha.toFixed(2)),
            rollRate: Number(rawGyro.beta.toFixed(2)),
            fusedPitch: Number(fusedPitch.toFixed(2)),
            fusedRoll: Number(fusedRoll.toFixed(2)),
            sens: sensitivity,
            hold: isLeftButtonDown,
            ts: Date.now()
          });
          document.getElementById("debugText").innerText =
            `YawRate: ${rawGyro.gamma.toFixed(1)}°/s | PitchRate: ${rawGyro.alpha.toFixed(1)}°/s\n` +
            `Fused Pitch: ${fusedPitch.toFixed(1)}° | Roll: ${fusedRoll.toFixed(1)}°`;
        }
      }, 20);

      // Heartbeat setiap 500 ms untuk mencegah tombol HOLD nyangkut jika sinyal putus
      setInterval(() => {
        sendPacket({ t: "HEARTBEAT", ts: Date.now() });
      }, 500);
    } else {
      // Jika tombol ditekan lagi, lakukan Re-Center orientasi
      basePitch = fusedPitch;
      baseRoll  = fusedRoll;
      triggerHaptic(50);
    }
  }
</script>
</body>
</html>
